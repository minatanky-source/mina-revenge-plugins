name: Temporary MINA VFX recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  recover:
    if: github.head_ref == 'tmp-mina-vfx-recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public MINA VFX deploy
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p recovered
          curl -fL --retry 3 -D recovered/root.headers.txt https://mina-vfx.netlify.app/ -o recovered/root.html
          curl -fL --retry 3 -D recovered/upload.headers.txt https://mina-vfx.netlify.app/upload -o recovered/upload.html || true
          curl -fL --retry 3 -D recovered/setup.headers.txt https://mina-vfx.netlify.app/upload/setup -o recovered/setup.html || true
          wget             --mirror             --page-requisites             --adjust-extension             --convert-links             --no-parent             --directory-prefix=recovered/mirror             https://mina-vfx.netlify.app/             https://mina-vfx.netlify.app/upload             https://mina-vfx.netlify.app/upload/setup || true
          find recovered -type f -maxdepth 8 -print | sort > recovered/files.txt

      - name: Upload recovered files
        uses: actions/upload-artifact@v4
        with:
          name: mina-vfx-public
          path: recovered
          if-no-files-found: error
          retention-days: 1
