# PR build validation

name: Validate

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'tests/**'
      - 'cli/**'
      - '.github/**'
      - 'repo.config.json'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Lint the workflow scripts
        run: shellcheck .github/scripts/*.sh

      - name: Install JavaScript dependencies
        run: bun install

      - name: Test plugin runtime behavior
        run: bun run test

      - name: Check TypeScript types
        run: bun run lint:types

      - name: Check out Revenge native API
        if: ${{ hashFiles('plugins/*/src/main/**/*.kt') != '' }}
        uses: actions/checkout@v4
        with:
          repository: revenge-mod/revenge-xposed
          ref: b4de869199c3b1bf4537450fdf2d410d4eb3031a
          path: .build/revenge-xposed

      - name: Publish Revenge API to Maven local
        if: ${{ hashFiles('plugins/*/src/main/**/*.kt') != '' }}
        run: .build/revenge-xposed/gradlew -p .build/revenge-xposed --no-daemon :api:publishToMavenLocal

      - name: Build all plugins
        run: ./gradlew --no-daemon packageAllPlugins

      - name: Generate index from built artifacts
        run: |
          bun run generate-index \
            --dist build/dist \
            --base-url https://revenge.local \
            --out /tmp/index.json
          cat /tmp/index.json
