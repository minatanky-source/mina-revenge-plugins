<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Conectar Roblox · Sha — 7</title>
  <link rel="stylesheet" href="style.css">
  <script src="callback.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">SHA — 7</p>
    <h1 id="title">Conectar sua conta</h1>
    <p id="status" role="status" aria-live="polite">Inicie a conexão usando <strong>/ro-mesh conta</strong> no Discord.</p>
    <div id="authorization" hidden>
      <ol>
        <li>Copie a autorização abaixo.</li>
        <li>Volte ao Discord e toque em <strong>Concluir conexão</strong>.</li>
        <li>Cole e envie. A Sha confirma quando terminar.</li>
      </ol>
      <label for="value">Sua autorização temporária</label>
      <textarea id="value" readonly spellcheck="false" autocomplete="off" rows="3"></textarea>
      <button id="copy" type="button">Copiar autorização</button>
      <p class="note">Conclua em até um minuto. Cole somente no formulário privado da Sha.</p>
    </div>
    <noscript>Ative o JavaScript para concluir a conexão.</noscript>
  </main>
</body>
</html>
